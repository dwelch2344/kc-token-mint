services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-keycloak}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  schema-server:
    image: nginx:alpine
    volumes:
      - ./harness/schema-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./harness/schema-server:/usr/share/nginx/html/schemas:ro
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/schemas/capability.json > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    build:
      context: .
      dockerfile: harness/Dockerfile
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${DATABASE_NAME:-keycloak}
      KC_DB_USERNAME: ${DATABASE_USERNAME:-postgres}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD:-postgres}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: "8888"

      # Allow HTTP schema URIs so the local schema-server (http://) works
      KC_SPI_REALM_RESTAPI_EXTENSION_MINT_ALLOW_HTTP_SCHEMAS: "true"
      # Allow private/loopback IPs for the local schema-server container
      KC_SPI_REALM_RESTAPI_EXTENSION_MINT_ALLOW_PRIVATE_IP_SCHEMAS: "true"

    command: start --optimized --import-realm
    volumes:
      - ./harness/realm-import.json:/opt/keycloak/data/import/realm-import.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8888}:8888"
    depends_on:
      db:
        condition: service_healthy
      schema-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3 && exec 3>&-"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  db_data:
